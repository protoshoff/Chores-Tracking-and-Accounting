<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chores Control Deck</title>
    <link
        href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700&family=Roboto:wght@300;400;700&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root {
            --bg-color: #050510;
            --panel-bg: rgba(0, 20, 40, 0.8);
            --primary: #00E5FF;
            --accent: #FF0055;
            --success: #00FF9D;
            --warning: #FFD700;
            --text-main: #FFFFFF;
            --text-dim: #8899AA;
            --border: 1px solid var(--primary);
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            font-family: 'Roboto', sans-serif;
            margin: 0;
            padding: 0;
            display: flex;
            flex-direction: column;
            min-height: 100vh;
        }

        h1,
        h2,
        h3,
        button,
        .sci-fi-font {
            font-family: 'Orbitron', sans-serif;
            text-transform: uppercase;
        }

        /* Header */
        header {
            background: rgba(0, 0, 0, 0.5);
            border-bottom: 2px solid var(--primary);
            padding: 1rem 2rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .brand {
            font-size: 1.5rem;
            color: var(--primary);
            text-shadow: 0 0 10px var(--primary);
        }

        #status-indicator {
            font-size: 0.9rem;
            color: var(--text-dim);
        }

        #status-indicator.online {
            color: var(--success);
        }

        #status-indicator.offline {
            color: var(--accent);
        }

        /* Nav */
        nav {
            background: rgba(0, 20, 40, 0.9);
            padding: 0.5rem 2rem;
            display: flex;
            gap: 1rem;
            overflow-x: auto;
        }

        .nav-btn {
            background: transparent;
            border: 1px solid transparent;
            color: var(--text-dim);
            padding: 0.8rem 1.5rem;
            cursor: pointer;
            transition: all 0.3s;
            font-weight: bold;
        }

        .nav-btn:hover {
            color: var(--primary);
            background: rgba(0, 229, 255, 0.1);
        }

        .nav-btn.active {
            color: var(--bg-color);
            background: var(--primary);
            box-shadow: 0 0 15px var(--primary);
        }

        /* Main Content */
        main {
            flex: 1;
            padding: 2rem;
            max-width: 1200px;
            margin: 0 auto;
            width: 100%;
        }

        .view-section {
            display: none;
            animation: fadeIn 0.3s;
        }

        .view-section.active {
            display: block;
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(10px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        /* Cards & Lists */
        .card {
            background: var(--panel-bg);
            border: 1px solid rgba(0, 229, 255, 0.3);
            border-radius: 8px;
            padding: 1.5rem;
            margin-bottom: 1.5rem;
            backdrop-filter: blur(5px);
        }

        .grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
            gap: 1.5rem;
        }

        .flex-between {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 1rem;
        }

        /* Controls */
        button.action-btn {
            background: rgba(0, 229, 255, 0.1);
            border: 1px solid var(--primary);
            color: var(--primary);
            padding: 0.6rem 1.2rem;
            cursor: pointer;
            transition: all 0.2s;
        }

        button.action-btn:hover {
            background: var(--primary);
            color: var(--bg-color);
        }

        button.danger {
            border-color: var(--accent);
            color: var(--accent);
            background: rgba(255, 0, 85, 0.1);
        }

        button.danger:hover {
            background: var(--accent);
            color: white;
        }

        input,
        select {
            background: rgba(0, 0, 0, 0.5);
            border: 1px solid #445566;
            color: white;
            padding: 0.5rem;
            border-radius: 4px;
            width: 100%;
            margin-bottom: 0.5rem;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 1rem;
        }

        th,
        td {
            text-align: left;
            padding: 1rem;
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
        }

        th {
            color: var(--primary);
        }

        /* Utility */
        .balance-display {
            font-size: 2rem;
            color: var(--primary);
            font-weight: bold;
        }

        .hidden {
            display: none !important;
        }

        /* Modal */
        .modal-overlay {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(0, 0, 0, 0.85);
            /* Darker backdrop */
            backdrop-filter: blur(4px);
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 1000;
            animation: fadeIn 0.2s;
        }

        .modal {
            background: rgba(10, 16, 32, 0.95);
            border: 1px solid var(--primary);
            box-shadow: 0 0 40px rgba(0, 229, 255, 0.2), inset 0 0 20px rgba(0, 229, 255, 0.05);
            padding: 2rem;
            width: 90%;
            max-width: 500px;
            border-radius: 4px;
            /* Angled tech look */
            position: relative;
        }

        .modal h3 {
            color: var(--primary);
            border-bottom: 1px solid rgba(0, 229, 255, 0.3);
            padding-bottom: 10px;
            margin-top: 0;
        }

        /* Icon Helper */
        .btn-icon {
            margin-right: 8px;
        }

        button.action-btn i {
            pointer-events: none;
            /* Let clicks pass through icon */
        }
    </style>
</head>

<body>

    <header>
        <div class="brand">COMMAND CENTER</div>
        <div id="status-indicator">CONNECTING...</div>
    </header>

    <nav>
        <button class="nav-btn active" onclick="switchView('overview')">OVERVIEW</button>
        <button class="nav-btn" onclick="switchView('kids')">CREW</button>
        <button class="nav-btn" onclick="switchView('approvals')">APPROVALS</button>
        <button class="nav-btn" onclick="switchView('ledger')">LEDGER</button>
        <button class="nav-btn" onclick="switchView('settings')">SYSTEM</button>
    </nav>

    <main>
        <!-- OVERVIEW -->
        <section id="view-overview" class="view-section active">
            <div class="card">
                <h2>System Status</h2>
                <div id="dashboard-stats">Loading stats...</div>
            </div>

            <div class="card">
                <h3>Quick Actions</h3>
                <div class="flex-between">
                    <button class="action-btn" onclick="switchView('approvals')"><i class="fa fa-clipboard-check"></i>
                        REVIEW PENDING</button>
                    <button class="action-btn" onclick="switchView('ledger')"><i class="fa fa-coins"></i> PAYOUT
                        ALLOWANCE</button>
                    <button class="action-btn" onclick="switchView('chores')"><i class="fa fa-tasks"></i> MANAGE
                        QUESTS</button>
                </div>
            </div>
        </section>

        <!-- APPROVALS (NEW) -->
        <section id="view-approvals" class="view-section">
            <h2>Mission Command (Approvals)</h2>
            <div id="approvals-container">
                <!-- Injected ordered by date -->
            </div>
        </section>

        <!-- KIDS MANAGE -->
        <section id="view-kids" class="view-section">
            <div class="flex-between">
                <h2>Crew Roster</h2>
                <button class="action-btn" onclick="showAddKidModal()"><i class="fa fa-plus"></i> RECRUIT</button>
            </div>
            <div id="kids-grid" class="grid">
                <!-- Kids cards injected here -->
            </div>
        </section>

        <!-- CHORES MANAGE -->
        <section id="view-chores" class="view-section">
            <div class="flex-between">
                <h2>Quest Database</h2>
                <button class="action-btn" onclick="showAddChoreModal()"><i class="fa fa-plus"></i> NEW QUEST</button>
            </div>
            <table id="chores-table">
                <thead>
                    <tr>
                        <th>NAME</th>
                        <th>REWARD</th>
                        <th>TYPE</th>
                        <th>ACTIONS</th>
                    </tr>
                </thead>
                <tbody>
                    <!-- Rows -->
                </tbody>
            </table>
        </section>

        <!-- LEDGER -->
        <section id="view-ledger" class="view-section">
            <h2>Ledger Operations</h2>
            <div style="margin-bottom: 1rem;">
                <select id="ledger-kid-select" onchange="loadLedgerHistory()">
                    <option value="">Select Crew Member...</option>
                </select>
            </div>

            <div class="card hidden" id="ledger-panel">
                <div class="flex-between">
                    <div>
                        <div style="color:var(--text-dim)">CURRENT BALANCE</div>
                        <div class="balance-display" id="ledger-balance">$0.00</div>
                    </div>
                    <div>
                        <button class="action-btn danger" onclick="doPayout()"><i class="fa fa-money-bill-wave"></i>
                            PAYOUT ALL</button>
                        <button class="action-btn" onclick="showAdjustModal()"><i class="fa fa-sliders-h"></i> ADJUST
                            (+/-)</button>
                    </div>
                </div>

                <h3>Transaction History</h3>
                <table id="ledger-table">
                    <thead>
                        <tr>
                            <th>DATE</th>
                            <th>DESC</th>
                            <th>AMOUNT</th>
                            <th>ACTION</th>
                        </tr>
                    </thead>
                    <tbody></tbody>
                </table>
            </div>
        </section>

        <!-- SETTINGS -->
        <section id="view-settings" class="view-section">
            <h2>System Configuration</h2>
            <div class="card">
                <h3>Security</h3>
                <div style="display:flex; gap:1rem; align-items:center;">
                    <input type="password" id="new-pin" placeholder="Enter New PIN (4 digits)" style="max-width:200px;">
                    <button class="action-btn" onclick="updatePin()">UPDATE PIN</button>
                </div>
            </div>
        </section>

    </main>

    <!-- MODALS -->
    <div id="modal-container" class="modal-overlay hidden">
        <!-- Dynamic Content -->
    </div>

    <!-- TOASTS -->
    <div id="toast-container" style="position:fixed; bottom:20px; right:20px; z-index:2000;"></div>

    <script>
        const API_BASE = "";

        // UTILS
        function $(sel) { return document.querySelector(sel); }
        function $all(sel) { return document.querySelectorAll(sel); }
        function formatMoney(cents) { return "$" + (cents / 100).toFixed(2); }

        function showToast(msg, type = 'info') {
            const c = $('#toast-container');
            const el = document.createElement('div');
            el.style.background = 'rgba(0, 20, 40, 0.95)';
            el.style.border = type === 'error' ? '1px solid var(--accent)' : '1px solid var(--primary)';
            el.style.color = 'white';
            el.style.padding = '1rem 2rem';
            el.style.marginBottom = '10px';
            el.style.borderRadius = '4px';
            el.style.boxShadow = '0 0 10px rgba(0,0,0,0.5)';
            el.style.fontFamily = "'Orbitron', sans-serif";
            el.style.animation = 'fadeIn 0.3s';
            el.innerHTML = `<i class="fa ${type === 'error' ? 'fa-exclamation-triangle' : 'fa-check-circle'}" style="color:${type === 'error' ? 'var(--accent)' : 'var(--primary)'}"></i> &nbsp; ${msg}`;

            c.appendChild(el);
            setTimeout(() => {
                el.style.opacity = '0';
                setTimeout(() => el.remove(), 300);
            }, 3000);
        }

        // NAV
        function switchView(viewName) {
            $all('.view-section').forEach(el => el.classList.remove('active'));
            $(`#view-${viewName}`).classList.add('active');

            $all('.nav-btn').forEach(el => el.classList.remove('active'));
            $all(`.nav-btn[onclick="switchView('${viewName}')"]`).forEach(el => el.classList.add('active'));

            if (viewName === 'kids') loadKids();
            if (viewName === 'chores') loadChores();
            if (viewName === 'ledger') loadKidsForLedger();
            if (viewName === 'approvals') loadApprovals();
        }

        // API
        async function api(endpoint, method = "GET", body = null) {
            try {
                const opts = { method, headers: { 'Content-Type': 'application/json' } };
                if (body) opts.body = JSON.stringify(body);
                const res = await fetch(`/api${endpoint}`, opts);
                if (!res.ok) throw new Error(res.statusText);
                if (method === "DELETE") return true;
                return await res.json();
            } catch (e) {
                console.error(e);
                showToast("API Error: " + e.message, 'error');
                return null;
            }
        }

        // INIT
        async function init() {
            try {
                const status = await api('/system/status');
                if (status) {
                    $('#status-indicator').textContent = `ONLINE (v${status.version})`;
                    $('#status-indicator').className = 'online';
                    $('#dashboard-stats').innerHTML = `
                    <p><i class="fa fa-clock"></i> System Time: ${status.timestamp}</p>
                    <p><i class="fa fa-server"></i> Uptime: ${status.uptime}</p>
                `;
                }
            } catch (e) {
                $('#status-indicator').textContent = 'OFFLINE';
                $('#status-indicator').className = 'offline';
            }

            loadKids();
        }

        // --- APPROVALS ---
        async function loadApprovals() {
            const list = await api('/approvals/pending');
            const cont = $('#approvals-container');
            cont.innerHTML = "";

            if (!list || list.length === 0) {
                cont.innerHTML = "<div style='color:var(--text-dim)'><i class='fa fa-check-double'></i> &nbsp; All caught up! No pending authorizations.</div>";
                return;
            }

            // Group by Date
            const groups = {};
            list.forEach(item => {
                const d = item.date.split('T')[0];
                if (!groups[d]) groups[d] = [];
                groups[d].push(item);
            });

            const sortedDates = Object.keys(groups).sort().reverse();

            sortedDates.forEach(dateStr => {
                cont.innerHTML += `<h3 style='color:var(--primary); border-bottom:1px solid var(--primary); padding-bottom:5px; margin-top:20px;'><i class='fa fa-calendar-alt'></i> ${dateStr}</h3>`;

                groups[dateStr].forEach(item => {
                    cont.innerHTML += `
                    <div class="card flex-between" style="border-left: 4px solid var(--warning);">
                        <div>
                            <div class="sci-fi-font" style="font-size:1.2rem; color:white;">${item.kid_name}</div>
                            <div style="color:var(--text-dim)">${item.chore_name}</div>
                        </div>
                        <div style="display:flex; gap:10px;">
                            <button class="action-btn" onclick="review('${item.id}', 'APPROVE')"><i class="fa fa-beer"></i> APPROVE</button>
                            <button class="action-btn danger" onclick="review('${item.id}', 'REJECT')"><i class="fa fa-times"></i> REJECT</button>
                        </div>
                    </div>`;
                });
            });
        }

        async function review(id, action) {
            const res = await api(`/approvals/${id}/review`, 'POST', { action: action });
            if (res) {
                showToast(`Mission ${action === 'APPROVE' ? 'Authorized' : 'Rejected'}`, 'success');
                loadApprovals();
            }
        }

        // KIDS
        async function loadKids() {
            const kids = await api('/kids');
            if (!kids) return;

            const grid = $('#kids-grid');
            grid.innerHTML = "";
            kids.forEach(k => {
                grid.innerHTML += `
                <div class="card">
                    <h3><i class="fa fa-user-astronaut"></i> ${k.name}</h3>
                    <div class="balance-display">${formatMoney(k.balance_cents)}</div>
                    <div style="margin-top:1rem;">
                        <button class="action-btn" onclick="editKid(${k.id}, '${k.name}')"><i class="fa fa-pen"></i> EDIT</button>
                    </div>
                </div>
            `;
            });
        }

        function showAddKidModal() {
            showModal(`
            <h3>Recruit Crew Member</h3>
            <div style="margin-bottom:1rem;"><i class="fa fa-user-plus fa-3x" style="color:var(--primary)"></i></div>
            <input id="kid-name" placeholder="Enter Name" autofocus />
            <div class="flex-between">
                <button class="action-btn danger" onclick="closeModal()">CANCEL</button>
                <button class="action-btn" onclick="submitAddKid()">CONFIRM</button>
            </div>
        `);
        }

        async function submitAddKid() {
            const name = $('#kid-name').value;
            if (!name) return showToast("Name required", 'error');
            const res = await api('/management/kids', 'POST', { name: name });
            if (res) {
                showToast("Crew Member Recruited", 'success');
                closeModal();
                loadKids();
            }
        }

        function editKid(id, currentName) {
            showModal(`
            <h3>Edit Profile</h3>
            <input id="edit-kid-name" value="${currentName}" placeholder="Name" />
            <div class="flex-between">
                <button class="action-btn danger" onclick="closeModal()">CANCEL</button>
                <button class="action-btn" onclick="submitEditKid(${id})">UPDATE</button>
            </div>
            `);
        }

        async function submitEditKid(id) {
            const name = $('#edit-kid-name').value;
            if (!name) return showToast("Name required", 'error');
            const res = await api(`/management/kids/${id}`, 'PUT', { name: name });
            if (res) {
                showToast("Profile Updated", 'success');
                closeModal();
                loadKids();
            }
        }

        // CHORES
        async function loadChores() {
            const chores = await api('/management/chores');
            if (!chores) return;
            const tbody = $('#chores-table tbody');
            tbody.innerHTML = "";
            chores.forEach(c => {
                tbody.innerHTML += `
                <tr>
                    <td>${c.name}</td>
                    <td>${formatMoney(c.weight)}</td>
                    <td><span class="badge">${c.frequency}</span></td>
                    <td>
                        <button class="action-btn danger" onclick="deleteChore(${c.id})"><i class="fa fa-trash"></i></button>
                    </td>
                </tr>
            `;
            });
        }

        function showAddChoreModal() {
            api('/kids').then(kids => {
                let options = "";
                kids.forEach(k => options += `<option value="${k.id}">${k.name}</option>`);

                showModal(`
                    <h3>New Quest</h3>
                    <label>Assignee:</label>
                    <select id="chore-kid">${options}</select>
                    <input id="chore-name" placeholder="Quest Title" />
                    <input id="chore-val" type="number" placeholder="Reward (cents)" />
                    <select id="chore-type">
                        <option value="DAILY">Daily</option>
                        <option value="WEEKLY">Weekly</option>
                    </select>
                    <div class="flex-between" style="margin-top:1rem;">
                        <button class="action-btn danger" onclick="closeModal()">CANCEL</button>
                        <button class="action-btn" onclick="submitAddChore()">CREATE</button>
                    </div>
                `);
            });
        }

        async function submitAddChore() {
            const kidId = $('#chore-kid').value;
            const name = $('#chore-name').value;
            const val = parseInt($('#chore-val').value);
            const freq = $('#chore-type').value;

            if (!name || isNaN(val) || !kidId) return showToast("Invalid Data", 'error');

            const res = await api('/management/chores', 'POST', {
                kid_id: parseInt(kidId),
                name: name,
                weight: val,
                frequency: freq
            });
            if (res) {
                showToast("Quest Created", 'success');
                closeModal();
                loadChores();
            }
        }

        async function deleteChore(id) {
            if (confirm("Delete this quest from the database?")) {
                await api(`/management/chores/${id}`, 'DELETE');
                showToast("Quest Deleted", 'success');
                loadChores();
            }
        }

        // LEDGER
        async function loadKidsForLedger() {
            const kids = await api('/kids');
            const sel = $('#ledger-kid-select');
            sel.innerHTML = '<option value="">Select Crew Member...</option>';
            kids.forEach(k => {
                sel.innerHTML += `<option value="${k.id}">${k.name}</option>`;
            });
        }

        async function loadLedgerHistory() {
            const id = $('#ledger-kid-select').value;
            const panel = $('#ledger-panel');

            if (!id) { panel.classList.add('hidden'); return; }
            panel.classList.remove('hidden');

            const k = (await api('/kids')).find(x => x.id == id);
            $('#ledger-balance').textContent = formatMoney(k.balance_cents);

            const history = await api(`/ledger/${id}/history`);
            const tbody = $('#ledger-table tbody');
            tbody.innerHTML = "";
            history.forEach(h => {
                const isPos = h.amount_cents > 0;
                tbody.innerHTML += `
                <tr>
                    <td>${h.timestamp.split('T')[0]}</td>
                    <td>${h.description}</td>
                    <td style="color:${isPos ? 'var(--success)' : 'var(--accent)'}">
                        ${isPos ? '+' : ''}${formatMoney(h.amount_cents)}
                    </td>
                    <td><button class="action-btn danger" style="padding:0.2rem 0.5rem" onclick="deleteTx(${h.id})"><i class="fa fa-undo"></i></button></td>
                </tr>
            `;
            });
        }

        async function doPayout() {
            const id = $('#ledger-kid-select').value;
            if (!id) return;
            if (confirm("Process Full Payout? This will reset balance to $0.")) {
                await api(`/ledger/${id}/payout`, 'POST');
                showToast("Payout Processed", 'success');
                loadLedgerHistory();
            }
        }

        async function deleteTx(id) {
            if (confirm("Reverse and delete this transaction?")) {
                await api(`/ledger/transaction/${id}`, 'DELETE');
                showToast("Transaction Reversed", 'success');
                loadLedgerHistory();
            }
        }

        function showAdjustModal() {
            showModal(`
            <h3>Manual Adjustment</h3>
            <input id="adj-amt" type="number" placeholder="Amount (cents)" />
            <input id="adj-desc" placeholder="Reason (e.g. Bonus)" />
            <div class="flex-between">
                <button class="action-btn danger" onclick="closeModal()">CANCEL</button>
                <div style="display:flex; gap:0.5rem">
                    <button class="action-btn danger" onclick="submitAdjust(-1)">SUBTRACT</button>
                    <button class="action-btn" onclick="submitAdjust(1)">ADD</button>
                </div>
            </div>
        `);
        }

        async function submitAdjust(sign) {
            const id = $('#ledger-kid-select').value;
            const amt = parseInt($('#adj-amt').value);
            const desc = $('#adj-desc').value || "Manual";
            if (!id || isNaN(amt)) return showToast("Invalid Amount", 'error');

            const type = sign > 0 ? "BONUS" : "SPEND";
            await api('/ledger/transaction', 'POST', {
                kid_id: parseInt(id),
                amount_cents: Math.abs(amt) * sign,
                type: type,
                description: desc
            });
            showToast("Ledger Updated", 'success');
            closeModal();
            loadLedgerHistory();
        }

        // SETTINGS
        async function updatePin() {
            const p = $('#new-pin').value;
            if (p.length < 4) return showToast("PIN must be 4 digits", 'error');
            await api('/system/pin', 'PUT', { pin: p });
            showToast("System PIN Updated", 'success');
            $('#new-pin').value = "";
        }

        // MODAL SYSTEM
        function showModal(html) {
            const c = $('#modal-container');
            c.innerHTML = `<div class="modal fade-in">${html}</div>`;
            c.classList.remove('hidden');
        }
        function closeModal() {
            $('#modal-container').classList.add('hidden');
        }

        // BOOT
        init();
    </script>
</body>

</html>
