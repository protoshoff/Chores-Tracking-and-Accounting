<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chores Control Deck</title>
    <link
        href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700&family=Roboto:wght@300;400;700&display=swap"
        rel="stylesheet">
    <style>
        :root {
            --bg-color: #050510;
            --panel-bg: rgba(0, 20, 40, 0.8);
            --primary: #00E5FF;
            --accent: #FF0055;
            --success: #00FF9D;
            --warning: #FFD700;
            --text-main: #FFFFFF;
            --text-dim: #8899AA;
            --border: 1px solid var(--primary);
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            font-family: 'Roboto', sans-serif;
            margin: 0;
            padding: 0;
            display: flex;
            flex-direction: column;
            min-height: 100vh;
        }

        h1,
        h2,
        h3,
        button,
        .sci-fi-font {
            font-family: 'Orbitron', sans-serif;
            text-transform: uppercase;
        }

        /* Header */
        header {
            background: rgba(0, 0, 0, 0.5);
            border-bottom: 2px solid var(--primary);
            padding: 1rem 2rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .brand {
            font-size: 1.5rem;
            color: var(--primary);
            text-shadow: 0 0 10px var(--primary);
        }

        #status-indicator {
            font-size: 0.9rem;
            color: var(--text-dim);
        }

        #status-indicator.online {
            color: var(--success);
        }

        #status-indicator.offline {
            color: var(--accent);
        }

        /* Nav */
        nav {
            background: rgba(0, 20, 40, 0.9);
            padding: 0.5rem 2rem;
            display: flex;
            gap: 1rem;
            overflow-x: auto;
        }

        .nav-btn {
            background: transparent;
            border: 1px solid transparent;
            color: var(--text-dim);
            padding: 0.8rem 1.5rem;
            cursor: pointer;
            transition: all 0.3s;
            font-weight: bold;
        }

        .nav-btn:hover {
            color: var(--primary);
            background: rgba(0, 229, 255, 0.1);
        }

        .nav-btn.active {
            color: var(--bg-color);
            background: var(--primary);
            box-shadow: 0 0 15px var(--primary);
        }

        /* Main Content */
        main {
            flex: 1;
            padding: 2rem;
            max-width: 1200px;
            margin: 0 auto;
            width: 100%;
        }

        .view-section {
            display: none;
            animation: fadeIn 0.3s;
        }

        .view-section.active {
            display: block;
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(10px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        /* Cards & Lists */
        .card {
            background: var(--panel-bg);
            border: 1px solid rgba(0, 229, 255, 0.3);
            border-radius: 8px;
            padding: 1.5rem;
            margin-bottom: 1.5rem;
            backdrop-filter: blur(5px);
        }

        .grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
            gap: 1.5rem;
        }

        .flex-between {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 1rem;
        }

        /* Controls */
        button.action-btn {
            background: rgba(0, 229, 255, 0.1);
            border: 1px solid var(--primary);
            color: var(--primary);
            padding: 0.6rem 1.2rem;
            cursor: pointer;
            transition: all 0.2s;
        }

        button.action-btn:hover {
            background: var(--primary);
            color: var(--bg-color);
        }

        button.danger {
            border-color: var(--accent);
            color: var(--accent);
            background: rgba(255, 0, 85, 0.1);
        }

        button.danger:hover {
            background: var(--accent);
            color: white;
        }

        input,
        select {
            background: rgba(0, 0, 0, 0.5);
            border: 1px solid #445566;
            color: white;
            padding: 0.5rem;
            border-radius: 4px;
            width: 100%;
            margin-bottom: 0.5rem;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 1rem;
        }

        th,
        td {
            text-align: left;
            padding: 1rem;
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
        }

        th {
            color: var(--primary);
        }

        /* Utility */
        .balance-display {
            font-size: 2rem;
            color: var(--primary);
            font-weight: bold;
        }

        .hidden {
            display: none !important;
        }

        /* Modal */
        .modal-overlay {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(0, 0, 0, 0.85);
            /* Darker backdrop */
            backdrop-filter: blur(4px);
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 1000;
            animation: fadeIn 0.2s;
        }

        .modal {
            background: rgba(10, 16, 32, 0.95);
            border: 1px solid var(--primary);
            box-shadow: 0 0 40px rgba(0, 229, 255, 0.2), inset 0 0 20px rgba(0, 229, 255, 0.05);
            padding: 2rem;
            width: 90%;
            max-width: 500px;
            border-radius: 4px;
            /* Angled tech look */
            position: relative;
        }

        .modal h3 {
            color: var(--primary);
            border-bottom: 1px solid rgba(0, 229, 255, 0.3);
            padding-bottom: 10px;
            margin-top: 0;
        }

        /* Mobile Responsiveness */
        @media (max-width: 600px) {
            main {
                padding: 1rem;
            }

            .flex-between {
                flex-direction: column;
                align-items: stretch;
                gap: 1rem;
            }

            .action-btn {
                width: 100%;
                /* Full width buttons on mobile */
                margin-bottom: 0.5rem;
            }

            h2 {
                font-size: 1.5rem;
            }

            /* Adjust ledger layout */
            #ledger-table th,
            #ledger-table td {
                padding: 0.5rem;
                font-size: 0.9rem;
            }
        }
    </style>
</head>

<body>

    <header>
        <div class="brand">COMMAND CENTER</div>
        <div id="status-indicator">CONNECTING...</div>
    </header>

    <nav>
        <button class="nav-btn active" onclick="switchView('overview')">OVERVIEW</button>
        <button class="nav-btn" onclick="switchView('kids')">CREW</button>
        <button class="nav-btn" onclick="switchView('approvals')">APPROVALS</button>
        <button class="nav-btn" onclick="switchView('ledger')">LEDGER</button>
        <button class="nav-btn" onclick="switchView('settings')">SYSTEM</button>
    </nav>

    <main>
        <!-- OVERVIEW -->
        <section id="view-overview" class="view-section active">
            <div class="card">
                <h2>System Status</h2>
                <div id="dashboard-stats">Loading stats...</div>
            </div>

            <div class="card">
                <h3>Quick Actions</h3>
                <div class="flex-between">
                    <button class="action-btn" onclick="switchView('approvals')">REVIEW PENDING</button>
                    <button class="action-btn" onclick="switchView('ledger')">PAYOUT ALLOWANCE</button>
                    <button class="action-btn" onclick="switchView('chores')">MANAGE QUESTS</button>
                </div>
            </div>
        </section>

        <!-- APPROVALS (NEW) -->
        <section id="view-approvals" class="view-section">
            <h2>Mission Command (Approvals)</h2>
            <div id="approvals-container">
                <!-- Injected ordered by date -->
            </div>
        </section>

        <!-- KIDS MANAGE -->
        <section id="view-kids" class="view-section">
            <div class="flex-between">
                <h2>Crew Roster</h2>
                <button class="action-btn" onclick="showAddKidModal()">+ RECRUIT</button>
            </div>
            <div id="kids-grid" class="grid">
                <!-- Kids cards injected here -->
            </div>
        </section>

        <!-- CHORES MANAGE -->
        <section id="view-chores" class="view-section">
            <div class="flex-between">
                <h2>Quest Database</h2>
                <button class="action-btn" onclick="showAddChoreModal()">+ NEW QUEST</button>
            </div>
            <table id="chores-table">
                <thead>
                    <tr>
                        <th>NAME</th>
                        <th>REWARD</th>
                        <th>TYPE</th>
                        <th>ACTIONS</th>
                    </tr>
                </thead>
                <tbody>
                    <!-- Rows -->
                </tbody>
            </table>
        </section>

        <!-- LEDGER -->
        <section id="view-ledger" class="view-section">
            <h2>Ledger Operations</h2>
            <div style="margin-bottom: 1rem;">
                <select id="ledger-kid-select" onchange="loadLedgerHistory()">
                    <option value="">Select Crew Member...</option>
                </select>
            </div>

            <div class="card hidden" id="ledger-panel">
                <div class="flex-between">
                    <div>
                        <div style="color:var(--text-dim)">CURRENT BALANCE</div>
                        <div class="balance-display" id="ledger-balance">$0.00</div>
                    </div>
                    <div>
                        <button class="action-btn danger" onclick="doPayout()">PAYOUT ALL</button>
                        <button class="action-btn" onclick="showAdjustModal()">ADJUST (+/-)</button>
                    </div>
                </div>

                <h3>Transaction History</h3>
                <table id="ledger-table">
                    <thead>
                        <tr>
                            <th>DATE</th>
                            <th>DESC</th>
                            <th>AMOUNT</th>
                            <th>ACTION</th>
                        </tr>
                    </thead>
                    <tbody></tbody>
                </table>
            </div>
        </section>

        <!-- SETTINGS -->
        <section id="view-settings" class="view-section">
            <h2>System Configuration</h2>
            <div class="card">
                <h3>Security</h3>
                <div style="display:flex; gap:1rem; align-items:center;">
                    <input type="password" id="new-pin" placeholder="Enter New PIN (4 digits)" style="max-width:200px;">
                    <button class="action-btn" onclick="updatePin()">UPDATE PIN</button>
                </div>
            </div>
        </section>

    </main>

    <!-- MODALS -->
    <div id="modal-container" class="modal-overlay hidden">
        <!-- Dynamic Content -->
    </div>

    <!-- TOASTS -->
    <div id="toast-container" style="position:fixed; bottom:20px; right:20px; z-index:2000;"></div>

    <script>
        const API_BASE = "";

        // UTILS
        function $(sel) { return document.querySelector(sel); }
        function $all(sel) { return document.querySelectorAll(sel); }
        // UTILS
        function $(sel) { return document.querySelector(sel); }
        function $all(sel) { return document.querySelectorAll(sel); }
        function formatMoney(amount) {
            // Amount is already in dollars float
            return "$" + parseFloat(amount).toFixed(2);
        }

        function showToast(msg, type = 'info') {
            const c = $('#toast-container');
            const el = document.createElement('div');
            el.style.background = 'rgba(0, 20, 40, 0.95)';
            el.style.border = type === 'error' ? '1px solid var(--accent)' : '1px solid var(--primary)';
            el.style.color = 'white';
            el.style.padding = '1rem 2rem';
            el.style.marginBottom = '10px';
            el.style.borderRadius = '4px';
            el.style.boxShadow = '0 0 10px rgba(0,0,0,0.5)';
            el.style.fontFamily = "'Orbitron', sans-serif";
            el.style.animation = 'fadeIn 0.3s';
            el.innerHTML = `<span style="color:${type === 'error' ? 'var(--accent)' : 'var(--primary)'}">&#9679;</span> &nbsp; ${msg}`;

            c.appendChild(el);
            setTimeout(() => {
                el.style.opacity = '0';
                setTimeout(() => el.remove(), 300);
            }, 3000);
        }

        // --- KIDS ---
        async function loadKids() {
            const kids = await api('/kids');
            if (!kids) return;

            const grid = $('#kids-grid');
            grid.innerHTML = "";
            kids.forEach(k => {
                grid.innerHTML += `
                <div class="card">
                    <h3>${k.name}</h3>
                    <div class="balance-display">${formatMoney(k.balance)}</div>
                    <div style="margin-top:1rem;">
                        <button class="action-btn" onclick="editKid(${k.id}, '${k.name}', ${k.allowance})">EDIT</button>
                    </div>
                </div>
            `;
            });
        }

        function showAddKidModal() {
            showModal(`
            <h3>Recruit Crew Member</h3>
            <div style="margin-bottom:1rem;color:var(--primary)">NEW PROFILE ENTRY</div>
            <input id="kid-name" placeholder="Enter Name" autofocus />
            <input id="kid-allowance" type="number" placeholder="Weekly Allowance ($)" step="0.5" />
            <div class="flex-between">
                <button class="action-btn danger" onclick="closeModal()">CANCEL</button>
                <button class="action-btn" onclick="submitAddKid()">CONFIRM</button>
            </div>
        `);
        }

        async function submitAddKid() {
            const name = $('#kid-name').value;
            const allowanceVal = $('#kid-allowance').value;
            const allowance = allowanceVal ? parseFloat(allowanceVal) : 0.0;

            if (!name) return showToast("Name required", 'error');
            const res = await api('/management/kids', 'POST', {
                name: name,
                allowance: allowance
            });
            if (res) {
                showToast("Crew Member Recruited", 'success');
                closeModal();
                loadKids();
            }
        }

        function editKid(id, currentName, currentAllowance) {
            showModal(`
            <h3>Edit Profile</h3>
            <label>Name:</label>
            <input id="edit-kid-name" value="${currentName}" placeholder="Name" />
            <label>Weekly Allowance ($):</label>
            <input id="edit-kid-allowance" type="number" value="${currentAllowance}" placeholder="0.00" step="0.5" />
            <div class="flex-between">
                <button class="action-btn danger" onclick="closeModal()">CANCEL</button>
                <button class="action-btn" onclick="submitEditKid(${id})">UPDATE</button>
            </div>
            `);
        }

        async function submitEditKid(id) {
            const name = $('#edit-kid-name').value;
            const allowanceVal = $('#edit-kid-allowance').value;
            const allowance = allowanceVal ? parseFloat(allowanceVal) : 0.0;

            if (!name) return showToast("Name required", 'error');
            const res = await api(`/management/kids/${id}`, 'PUT', {
                name: name,
                allowance: allowance
            });
            if (res) {
                showToast("Profile Updated", 'success');
                closeModal();
                loadKids();
            }
        }

        // --- CHORES ---
        async function loadChores() {
            const chores = await api('/management/chores');
            if (!chores) return;
            const tbody = $('#chores-table tbody');
            tbody.innerHTML = "";
            chores.forEach(c => {
                tbody.innerHTML += `
                <tr>
                    <td>${c.name}</td>
                    <td>${formatMoney(c.reward)}</td>
                    <td><span class="badge">${c.frequency}</span></td>
                    <td>
                        <button class="action-btn danger" onclick="deleteChore(${c.id})">DEL</button>
                    </td>
                </tr>
            `;
            });
        }

        function showAddChoreModal() {
            api('/kids').then(kids => {
                let options = "";
                kids.forEach(k => options += `<option value="${k.id}">${k.name}</option>`);

                showModal(`
                    <h3>New Quest</h3>
                    <label>Assignee:</label>
                    <select id="chore-kid">${options}</select>
                    <input id="chore-name" placeholder="Quest Title" />
                    <input id="chore-val" type="number" placeholder="Reward ($)" step="0.5" />
                    <select id="chore-type">
                        <option value="DAILY">Daily</option>
                        <option value="WEEKLY">Weekly</option>
                    </select>
                    <div class="flex-between" style="margin-top:1rem;">
                        <button class="action-btn danger" onclick="closeModal()">CANCEL</button>
                        <button class="action-btn" onclick="submitAddChore()">CREATE</button>
                    </div>
                `);
            });
        }

        async function submitAddChore() {
            const kidId = $('#chore-kid').value;
            const name = $('#chore-name').value;
            const val = parseFloat($('#chore-val').value);
            const freq = $('#chore-type').value;

            if (!name || isNaN(val) || !kidId) return showToast("Invalid Data", 'error');

            const res = await api('/management/chores', 'POST', {
                kid_id: parseInt(kidId),
                name: name,
                reward: val,
                frequency: freq
            });
            if (res) {
                showToast("Quest Created", 'success');
                closeModal();
                loadChores();
            }
        }

        // --- LEDGER ---
        async function loadLedgerHistory() {
            const id = $('#ledger-kid-select').value;
            const panel = $('#ledger-panel');

            if (!id) { panel.classList.add('hidden'); return; }
            panel.classList.remove('hidden');

            const k = (await api('/kids')).find(x => x.id == id);
            $('#ledger-balance').textContent = formatMoney(k.balance);

            const history = await api(`/ledger/${id}/history`);
            const tbody = $('#ledger-table tbody');
            tbody.innerHTML = "";
            history.forEach(h => {
                const isPos = h.amount > 0;
                tbody.innerHTML += `
                <tr>
                    <td>${h.timestamp.split('T')[0]}</td>
                    <td>${h.description}</td>
                    <td style="color:${isPos ? 'var(--success)' : 'var(--accent)'}">
                        ${isPos ? '+' : ''}${formatMoney(h.amount)}
                    </td>
                    <td><button class="action-btn danger" style="padding:0.2rem 0.5rem" onclick="deleteTx(${h.id})">X</button></td>
                </tr>
            `;
            });
        }

        function showAdjustModal() {
            showModal(`
            <h3>Manual Adjustment</h3>
            <input id="adj-amt" type="number" placeholder="Amount ($)" step="0.10" />
            <input id="adj-desc" placeholder="Reason (e.g. Bonus)" />
            <div class="flex-between">
                <button class="action-btn danger" onclick="closeModal()">CANCEL</button>
                <div style="display:flex; gap:0.5rem">
                    <button class="action-btn danger" onclick="submitAdjust(-1)">SUBTRACT</button>
                    <button class="action-btn" onclick="submitAdjust(1)">ADD</button>
                </div>
            </div>
        `);
        }

        async function submitAdjust(sign) {
            const id = $('#ledger-kid-select').value;
            const amt = parseFloat($('#adj-amt').value);
            const desc = $('#adj-desc').value || "Manual";
            if (!id || isNaN(amt)) return showToast("Invalid Amount", 'error');

            const type = sign > 0 ? "BONUS" : "SPEND";
            await api('/ledger/transaction', 'POST', {
                kid_id: parseInt(id),
                amount: Math.abs(amt) * sign,
                type: type,
                description: desc
            });
            showToast("Ledger Updated", 'success');
            closeModal();
            loadLedgerHistory();
        }

        // SETTINGS
        async function updatePin() {
            const p = $('#new-pin').value;
            if (p.length < 4) return showToast("PIN must be 4 digits", 'error');
            await api('/system/pin', 'PUT', { pin: p });
            showToast("System PIN Updated", 'success');
            $('#new-pin').value = "";
        }

        // MODAL SYSTEM
        function showModal(html) {
            const c = $('#modal-container');
            c.innerHTML = `<div class="modal fade-in">${html}</div>`;
            c.classList.remove('hidden');
        }
        function closeModal() {
            $('#modal-container').classList.add('hidden');
        }

        // BOOT
        init();
    </script>

</body>

</html>
